spring.application.name=asmj-marketplace-backend
spring.data.mongodb.auto-index-creation=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-256-bit-secret-key-for-production}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
app.seed.enabled=${APP_SEED_ENABLED:true}
logging.level.com.asmj.marketplace=INFO
rental.max-km-per-hour=${RENTAL_MAX_KM_PER_HOUR:120}
server.port=${PORT:8080}
server.address=0.0.0.0
spring.data.mongodb.uri=${MONGODB_URI}
